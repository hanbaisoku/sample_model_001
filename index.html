<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Manual T-Shirt Try-On</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            touch-action: none; /* スマホでの意図しないスクロールやズームを防止 */
            font-family: sans-serif;
        }

        /* カメラ映像を画面全体にフィット */
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transform: scaleX(-1); /* 初期値はインカメラ用に反転 */
        }

        /* 試着するTシャツ画像 */
        #tshirt-image {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280px; /* 初期サイズ */
            height: auto;
            transform: translate(-50%, -50%);
            z-index: 2;
            cursor: grab;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        #tshirt-image:active {
            cursor: grabbing;
        }

        /* 操作UIパネル（画面上部に配置） */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 85%;
            max-width: 320px;
            color: #fff;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        label {
            font-size: 12px;
            white-space: nowrap;
        }

        input[type="range"] {
            flex-grow: 1;
        }

        button {
            background: #ff5722;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        button:active {
            background: #e64a19;
        }
    </style>
</head>
<body>

    <video id="camera-video" autoplay playsinline></video>

    <img id="tshirt-image" src="MS1136_model_sample.png" alt="T-Shirt">

    <div id="ui-panel">
        <div class="control-row">
            <label for="scale-slider">サイズ</label>
            <input type="range" id="scale-slider" min="100" max="600" value="280">
        </div>
        <button id="switch-camera-btn">カメラ切り替え (イン/アウト)</button>
        <button id="reset-btn">位置をリセット</button>
    </div>

    <script>
        const video = document.getElementById('camera-video');
        const tshirt = document.getElementById('tshirt-image');
        const scaleSlider = document.getElementById('scale-slider');
        const switchCameraBtn = document.getElementById('switch-camera-btn');
        const resetBtn = document.getElementById('reset-btn');

        let currentFacingMode = 'user'; // 'user' (イン), 'environment' (アウト)
        let posX = window.innerWidth / 2;
        let posY = window.innerHeight / 2;
        let currentWidth = 280;

        // カメラの起動
        async function startCamera(facingMode) {
            try {
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
                
                // インカメラの時は鏡写し、アウトカメラの時は通常の向きにする
                if (facingMode === 'user') {
                    video.style.transform = 'scaleX(-1)';
                } else {
                    video.style.transform = 'scaleX(1)';
                }
            } catch (err) {
                console.error("カメラの起動に失敗しました: ", err);
                alert("カメラへのアクセスが許可されていないか、利用できません。");
            }
        }

        // 初期位置とサイズの適用
        function updateTshirtTransform() {
            tshirt.style.left = posX + 'px';
            tshirt.style.top = posY + 'px';
            tshirt.style.width = currentWidth + 'px';
            tshirt.style.transform = 'translate(-50%, -50%)';
        }

        // リセット処理
        function resetPosition() {
            posX = window.innerWidth / 2;
            posY = window.innerHeight / 2;
            currentWidth = 280;
            scaleSlider.value = currentWidth;
            updateTshirtTransform();
        }

        // タッチ＆ドラッグによる位置移動の実装
        let isDragging = false;
        let startX, startY;

        function dragStart(e) {
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX - posX;
            startY = clientY - posY;
        }

        function dragMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            posX = clientX - startX;
            posY = clientY - startY;
            updateTshirtTransform();
        }

        function dragEnd() {
            isDragging = false;
        }

        // イベントリスナーの登録（マウス・タッチ両対応）
        tshirt.addEventListener('mousedown', dragStart);
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('mouseup', dragEnd);

        tshirt.addEventListener('touchstart', dragStart, { passive: false });
        window.addEventListener('touchmove', dragMove, { passive: false });
        window.addEventListener('touchend', dragEnd);

        // スライダーでサイズ変更
        scaleSlider.addEventListener('input', (e) => {
            currentWidth = parseInt(e.target.value);
            updateTshirtTransform();
        });

        // カメラ切り替えボタン
        switchCameraBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            startCamera(currentFacingMode);
        });

        // リセットボタン
        resetBtn.addEventListener('click', resetPosition);

        // 初期化実行
        window.addEventListener('load', () => {
            resetPosition();
            startCamera(currentFacingMode);
        });
    </script>
</body>
</html>
